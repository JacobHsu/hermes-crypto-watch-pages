<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預測市場命中熱力圖</title>
<link rel="icon" type="image/png" href="https://polymarket.com/icons/favicon-32x32.png">
<style>
/* ── Two-column layout ──────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  max-width: 1160px;
  margin: 0 auto;
  align-items: start;
}
.col-left, .col-right { min-width: 0; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
}

/* ── Gold calendar ──────────────────────────────── */
.cal-section {
  max-width: 480px;
  margin: 0 0 44px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cal-dow {
  text-align: center;
  font-size: .66rem;
  color: #6e7681;
  padding-bottom: 4px;
}
.cal-cell {
  border-radius: 6px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 34px;
  padding: 4px 0;
}
.cal-cell.empty { background: transparent; }
.cal-cell.void    { background: #1c1f24 !important; border: 1px solid #21262d; opacity: .5; }
.cal-cell.pending { background: #2d1f0a !important; border: 1px solid #6b430060; }
.cal-cell .b-date { font-size: .56rem; }
.cal-cell .b-pct  { font-size: .68rem; }

/* ── Reset & base ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117;
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  padding: 28px 20px 56px;
}

/* ── Header ───────────────────────────────────── */
.header {
  text-align: center;
  margin-bottom: 28px;
}
.header h1 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: 5px;
}
.header p { font-size: .8rem; color: #8b949e; }
.coin-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 8px; }
.coin-row img { width: 26px; height: 26px; border-radius: 50%; }

/* ── Stats pills ───────────────────────────────── */
.pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
}
.pill {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
  border: 1px solid #21262d;
  background: #161b22;
}
.pill .v { display: inline-block; margin-left: 4px; }
.pill.g { border-color: #2ea04380; }
.pill.g .v { color: #3fb950; }
.pill.r { border-color: #cf222e80; }
.pill.r .v { color: #f85149; }
.pill.y .v { color: #d29922; }

/* ── Section label ─────────────────────────────── */
.section {
  max-width: 860px;
  margin: 0 0 44px;
}
.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.section-head img { width: 28px; height: 28px; border-radius: 50%; }
.section-head h2 { font-size: 1rem; font-weight: 600; }
.section-head .rate { margin-left: auto; font-size: .82rem; color: #8b949e; }
.section-head .rate strong { font-size: 1rem; margin-left: 4px; }
.section-head .rate strong.g { color: #3fb950; }
.section-head .rate strong.r { color: #f85149; }

/* ── Heatmap grid ──────────────────────────────── */
.heatmap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* ── Block ─────────────────────────────────────── */
.block {
  width: 62px;
  height: 62px;
  border-radius: 10px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: default;
  transition: transform .12s, box-shadow .12s;
  flex-shrink: 0;
}
.block:hover { transform: scale(1.07); box-shadow: 0 6px 20px #0009; z-index: 2; }

/* ── Color scale ────────────────────────────────
   actual pct → background is set via inline style
   but we define base colour classes for void/pending/calib */
.block.void    { background: #1c1f24 !important; border: 1px solid #21262d; opacity: .6; }
.block.pending { background: #2d1f0a !important; border: 1px solid #6b430060; }
.block.calib   { background: #0e1f38 !important; border: 1px solid #1f3d6b60; opacity: .7; }

/* ── Text inside block ─────────────────────────── */
.b-date {
  position: absolute;
  top: 5px;
  left: 7px;
  font-size: .6rem;
  font-weight: 600;
  opacity: .65;
  line-height: 1;
}
.b-pct {
  font-size: .82rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 3px;
  letter-spacing: -.01em;
}
.b-pick {
  font-size: .7rem;
  opacity: .75;
  line-height: 1;
}
/* miss marker */
.b-miss-x {
  position: absolute;
  bottom: 5px;
  right: 6px;
  font-size: .62rem;
  opacity: .7;
  color: #f85149;
}

/* ── HIT shimmer animation ─────────────────────── */
@keyframes shimmer {
  0%   { transform: translateX(-120%) skewX(-15deg); }
  100% { transform: translateX(250%)  skewX(-15deg); }
}
@keyframes shimmer-slow {
  0%, 70% { transform: translateX(-120%) skewX(-15deg); opacity: 0; }
  72%      { opacity: 1; }
  100%     { transform: translateX(250%)  skewX(-15deg); opacity: 0; }
}
.block.hit::before {
  content: '';
  position: absolute;
  top: -20%;
  left: 0;
  width: 40%;
  height: 140%;
  background: linear-gradient(
    105deg,
    transparent 20%,
    rgba(255,255,255,.45) 50%,
    transparent 80%
  );
  animation: shimmer-slow 2.6s ease-in-out infinite;
  pointer-events: none;
  z-index: 3;
}
/* subtle glow pulse on hit */
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 0px 0px transparent; }
  50%       { box-shadow: 0 0 10px 2px rgba(63,185,80,.45); }
}
.block.hit { animation: glow-pulse 2.6s ease-in-out infinite; }

/* ── Legend ───────────────────────────────────── */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 30px;
  font-size: .76rem;
  color: #8b949e;
  justify-content: center;
}
.leg { display: flex; align-items: center; gap: 5px; }
.leg-sq {
  width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0;
}

/* ── Tooltip ──────────────────────────────────── */
.block .tip {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #1c2128;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 9px 12px;
  width: 200px;
  font-size: .72rem;
  line-height: 1.65;
  z-index: 100;
  color: #e6edf3;
  box-shadow: 0 8px 24px #0009;
  pointer-events: none;
  white-space: normal;
  text-align: left;
}
.block:hover .tip { display: block; }
.tip .tl { color: #8b949e; font-size: .66rem; }

/* ── Responsive ───────────────────────────────── */
@media (max-width: 520px) {
  .block { width: 52px; height: 52px; border-radius: 8px; }
  .b-pct { font-size: .72rem; }
}
@media (max-width: 380px) {
  .block { width: 44px; height: 44px; }
  .b-date { font-size: .52rem; }
  .b-pct  { font-size: .65rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ── Data ──────────────────────────────────────────────────────────── */
const ROWS = [
  // calibration (not eligible)
  {date:"2026-08-31",asset:"BTC",pick:"DOWN",actual:"DOWN",pct:-.31,status:"settled",eligible:false,strategy:"calibration_v0"},
  {date:"2026-08-31",asset:"ETH",pick:"DOWN",actual:"DOWN",pct:-.55,status:"settled",eligible:false,strategy:"calibration_v0"},

  // v2 eligible
  {date:"2026-09-06",asset:"BTC",pick:"UP",actual:"DOWN",pct:-0.11,status:"settled",eligible:true, hit:false},
  {date:"2026-09-06",asset:"ETH",pick:"UP",actual:"UP",pct:0.84,status:"settled",eligible:true, hit:true},
  {date:"2026-09-07",asset:"BTC",pick:"DOWN",actual:"DOWN",pct:-1.07,status:"settled",eligible:true, hit:true},
  {date:"2026-09-07",asset:"ETH",pick:"DOWN",actual:"DOWN",pct:-0.30,status:"settled",eligible:true, hit:true},
  {date:"2026-09-08",asset:"BTC",pick:"DOWN",actual:"DOWN",pct:-0.05,status:"settled",eligible:true, hit:true},
  {date:"2026-09-08",asset:"ETH",pick:"DOWN",actual:"UP",pct:0.98,status:"settled",eligible:true, hit:false},
  {date:"2026-09-09",asset:"BTC",pick:"UP",actual:"DOWN",pct:-0.27,status:"settled",eligible:true, hit:false},
  {date:"2026-09-09",asset:"ETH",pick:"UP",actual:"DOWN",pct:-0.23,status:"settled",eligible:true, hit:false},
  {date:"2026-09-10",asset:"BTC",pick:"DOWN",actual:"DOWN",pct:-1.67,status:"settled",eligible:true, hit:true},
  {date:"2026-09-10",asset:"ETH",pick:"DOWN",actual:"DOWN",pct:-1.91,status:"settled",eligible:true, hit:true},
  {date:"2026-09-11",asset:"BTC",pick:"DOWN",actual:"UP",pct:0.83,status:"settled",eligible:true, hit:false},
  {date:"2026-09-11",asset:"ETH",pick:"DOWN",actual:"UP",pct:5.19,status:"settled",eligible:true, hit:false},
  {date:"2026-09-12",asset:"BTC",pick:"UP",actual:"DOWN",pct:-0.71,status:"settled",eligible:true, hit:false},
  {date:"2026-09-12",asset:"ETH",pick:"UP",actual:"DOWN",pct:-1.37,status:"settled",eligible:true, hit:false},
  {date:"2026-09-13",asset:"BTC",pick:"UP",actual:"DOWN",pct:-0.30,status:"settled",eligible:true, hit:false},
  {date:"2026-09-13",asset:"ETH",pick:"DOWN",actual:"DOWN",pct:-1.71,status:"settled",eligible:true, hit:true},
  {date:"2026-09-14",asset:"BTC",pick:"UP",actual:"UP",pct:1.82,status:"settled",eligible:true, hit:true},
  {date:"2026-09-14",asset:"ETH",pick:"UP",actual:"UP",pct:0.66,status:"settled",eligible:true, hit:true},
  {date:"2026-09-15",asset:"BTC",pick:"UP",actual:"DOWN",pct:-2.67,status:"settled",eligible:true, hit:false},
  {date:"2026-09-15",asset:"ETH",pick:"DOWN",actual:"DOWN",pct:-3.44,status:"settled",eligible:true, hit:true},
  {date:"2026-09-16",asset:"BTC",pick:"DOWN",actual:"DOWN",pct:-0.89,status:"settled",eligible:true, hit:true},
  {date:"2026-09-16",asset:"ETH",pick:"DOWN",actual:"DOWN",pct:-1.24,status:"settled",eligible:true, hit:true},
  {date:"2026-09-17",asset:"BTC",pick:"DOWN",actual:"UP",pct:1.30,status:"settled",eligible:true, hit:false},
  {date:"2026-09-17",asset:"ETH",pick:"DOWN",actual:"UP",pct:3.22,status:"settled",eligible:true, hit:false},
  {date:"2026-09-18",asset:"BTC",pick:"UP",actual:"UP",pct:5.13,status:"settled",eligible:true, hit:true},
  {date:"2026-09-18",asset:"ETH",pick:"UP",actual:"UP",pct:4.53,status:"settled",eligible:true, hit:true},
  {date:"2026-09-19",asset:"BTC",pick:"UP",actual:"UP",pct:1.14,status:"settled",eligible:true, hit:true},
  {date:"2026-09-19",asset:"ETH",pick:"UP",actual:"UP",pct:2.30,status:"settled",eligible:true, hit:true},
  {date:"2026-09-20",asset:"BTC",pick:"UP",actual:"DOWN",pct:-0.93,status:"settled",eligible:true, hit:false},
  {date:"2026-09-20",asset:"ETH",pick:"UP",actual:"DOWN",pct:-1.17,status:"settled",eligible:true, hit:false},
  {date:"2026-09-21",asset:"BTC",pick:"UP",actual:"UP",pct:6.23,status:"settled",eligible:true, hit:true},
  {date:"2026-09-21",asset:"ETH",pick:"UP",actual:"UP",pct:5.56,status:"settled",eligible:true, hit:true},
  {date:"2026-09-22",asset:"BTC",pick:"UP",actual:"UP",pct:0.59,status:"settled",eligible:true, hit:true},
  {date:"2026-09-22",asset:"ETH",pick:"DOWN",actual:"DOWN",pct:-0.36,status:"settled",eligible:true, hit:true},
  {date:"2026-09-23",asset:"BTC",pick:"UP",actual:"DOWN",pct:-2.78,status:"settled",eligible:true, hit:false},
  {date:"2026-09-23",asset:"ETH",pick:"UP",actual:"DOWN",pct:-3.26,status:"settled",eligible:true, hit:false},
  {date:"2026-09-24",asset:"BTC",pick:"DOWN",actual:null,  pct:null, status:"pending",eligible:true},
  {date:"2026-09-24",asset:"ETH",pick:"DOWN",actual:null,  pct:null, status:"pending",eligible:true},
];

// GOLD calendar data
const GOLD_ROWS = [
  {date:"2026-09-23",pick:"UP",actual:"DOWN",pct:null,status:"settled",eligible:true, hit:false},
  {date:"2026-09-24",pick:"DOWN",actual:null,  pct:null, status:"pending",eligible:true},
];

// SILVER calendar data
const SILVER_ROWS = [
  {date:"2026-09-24",pick:"DOWN",actual:"DOWN",pct:null,status:"settled",eligible:true, hit:true},
  {date:"2026-09-25",pick:"UP",actual:null,  pct:null, status:"pending",eligible:true},
];

/* ── Color scale ──────────────────────────────────────────────────── */
/* Maps actual % return → background colour.
   Intensity capped at ±5 % so normal ±2 % moves show clearly. */
function blockBg(pct) {
  if (pct === null || pct === undefined) return null;
  const CAP = 5;
  const t = Math.min(Math.abs(pct) / CAP, 1);   // 0→1
  if (pct > 0) {
    // green: #0d3320 → #1a7f37 → #2ea043
    const r = Math.round(13  + t * (26  - 13));
    const g = Math.round(51  + t * (160 - 51));
    const b = Math.round(32  + t * (67  - 32));
    return `rgb(${r},${g},${b})`;
  } else {
    // red: #3d1114 → #cf222e
    const r = Math.round(61  + t * (207 - 61));
    const g = Math.round(17  + t * (34  - 17));
    const b = Math.round(20  + t * (46  - 20));
    return `rgb(${r},${g},${b})`;
  }
}

/* border colour = slightly brighter than fill */
function blockBorder(pct) {
  if (pct === null) return '#21262d';
  return pct > 0 ? '#2ea04380' : '#cf222e80';
}

/* ── Block HTML ───────────────────────────────────────────────────── */
function blockHTML(r) {
  const day = r.date.slice(8);  // "06"
  const isCalib   = r.strategy === 'calibration_v0';
  const isVoid    = r.status === 'void';
  const isPending = r.status === 'pending';
  const isHit     = r.eligible && r.hit === true;
  const isMiss    = r.eligible && r.hit === false;

  // Class
  let cls = 'block';
  if (isCalib)   cls += ' calib';
  else if (isVoid)    cls += ' void';
  else if (isPending) cls += ' pending';
  else if (isHit)     cls += ' hit';

  // Inline style
  const bg  = (!isCalib && !isVoid && !isPending && r.pct !== null) ? blockBg(r.pct) : '';
  const brd = (!isCalib && !isVoid && !isPending && r.pct !== null) ? blockBorder(r.pct) : '';
  const style = bg ? `style="background:${bg};border:1px solid ${brd};"` : '';

  // % text
  const pctStr = r.pct !== null ? `${r.pct > 0 ? '+' : ''}${r.pct.toFixed(2)}%` : (isPending ? '…' : '—');

  // Miss marker
  const missX = isMiss ? '<span class="b-miss-x">✗</span>' : '';

  // Strategy tag for tooltip
  const strat = r.strategy || 'v2';
  const stratLabel = strat === 'v2_contract_aligned' ? 'v2' : strat === 'calibration_v0' ? 'calibration' : strat;
  const eligStr = r.eligible ? '✓ 計入命中率' : '✗ 不計入命中率';
  const actualStr = r.actual || (isPending ? '待結算' : '—');

  const tip = `
    <div class="tip">
      <div><span class="tl">日期 </span><strong>${r.date}</strong></div>
      <div><span class="tl">策略 </span>${stratLabel}</div>
      <div><span class="tl">預測 </span>${r.pick || '—'} &nbsp;→&nbsp; 實際 ${actualStr}</div>
      <div><span class="tl">漲跌 </span>${pctStr}</div>
      <div style="margin-top:4px;font-size:.66rem;color:${r.eligible ? '#3fb950' : '#8b949e'}">${eligStr}</div>
    </div>`;

  return `
  <div class="${cls}" ${style} title="">
    <span class="b-date">${day}</span>
    <span class="b-pct">${pctStr}</span>
    ${missX}
    ${tip}
  </div>`;
}

/* ── Stats ────────────────────────────────────────────────────────── */
function stats(asset) {
  const rows    = ROWS.filter(r => r.asset === asset && r.eligible);
  const settled = rows.filter(r => r.status === 'settled');
  const hits    = settled.filter(r => r.hit);
  const rate    = settled.length ? hits.length / settled.length : null;

  const allRows  = ROWS.filter(r => r.asset === asset && r.status === 'settled' && r.actual);
  const curMonth = allRows.length ? allRows[allRows.length - 1].date.slice(0, 7) : null;
  const monthRows = curMonth ? allRows.filter(r => r.date.slice(0, 7) === curMonth) : [];
  const monthUp   = monthRows.filter(r => r.actual === 'UP').length;
  const monthDown = monthRows.filter(r => r.actual === 'DOWN').length;

  return { hits: hits.length, total: settled.length, rate, monthUp, monthDown };
}

/* ── Section HTML ──────────────────────────────────────────────────── */
function sectionHTML(asset) {
  const { hits, total, rate, monthUp, monthDown } = stats(asset);
  const rateStr   = rate !== null ? (rate * 100).toFixed(0) + '%' : '—';
  const rateCls   = rate === null ? '' : rate >= .5 ? 'g' : 'r';
  const img = asset === 'BTC'
    ? 'https://s2.coinmarketcap.com/static/img/coins/64x64/1.png'
    : 'https://s2.coinmarketcap.com/static/img/coins/64x64/1027.png';

  const rows = ROWS.filter(r => r.asset === asset);
  const blocks = rows.map(blockHTML).join('');

  return `
  <section class="section">
    <div class="section-head">
      <img src="${img}" alt="${asset}" onerror="this.style.display='none'">
      <h2>${asset}</h2>
      <div class="rate">
        <span style="color:#6e7681;font-size:.72rem;margin-right:8px">本月 ↑${monthUp}／↓${monthDown}</span>
        命中率 <strong class="${rateCls}">${rateStr}</strong>
        <span style="color:#6e7681;font-size:.72rem;margin-left:4px">(${hits}/${total})</span>
      </div>
    </div>
    <div class="heatmap">${blocks}</div>
  </section>`;
}

/* ── Global stats pills ───────────────────────────────────────────── */
function pillsHTML() {
  const all     = ROWS.filter(r => r.eligible);
  const settled = all.filter(r => r.status === 'settled');
  const hits    = settled.filter(r => r.hit);
  const misses  = settled.filter(r => !r.hit);
  const pending = all.filter(r => r.status === 'pending');
  const rate    = settled.length ? (hits.length / settled.length * 100).toFixed(1) : '—';
  const rc      = parseFloat(rate) >= 50 ? 'g' : 'r';

  return `
  <div class="pills">
    <div class="pill ${rc}">整體命中率 <span class="v">${rate}%</span></div>
    <div class="pill g">命中 <span class="v">${hits.length}</span></div>
    <div class="pill r">未中 <span class="v">${misses.length}</span></div>
    <div class="pill y">待結算 <span class="v">${pending.length}</span></div>
  </div>`;
}

/* ── Legend ───────────────────────────────────────────────────────── */
function legendHTML() {
  return `
  <div class="legend">
    <div class="leg"><div class="leg-sq" style="background:#1a7f37;border:1px solid #2ea04380"></div> 實際上漲（命中閃光）</div>
    <div class="leg"><div class="leg-sq" style="background:#7f1a20;border:1px solid #cf222e80"></div> 實際下跌（命中閃光）</div>
    <div class="leg"><div class="leg-sq" style="background:#0e1f38;border:1px solid #1f3d6b60;opacity:.7"></div> Calibration</div>
    <div class="leg"><div class="leg-sq" style="background:#2d1f0a;border:1px solid #6b430060"></div> 待結算</div>
  </div>`;
}

/* ── Precious-metal calendar (shared by GOLD and SILVER) ─────────────── */
function metalStats(rows) {
  const eligible = rows.filter(r => r.eligible);
  const settled  = eligible.filter(r => r.status === 'settled');
  const hits     = settled.filter(r => r.hit);
  const rate     = settled.length ? hits.length / settled.length : null;
  return { hits: hits.length, total: settled.length, rate };
}

function calCellHTML(r) {
  if (!r) return '<div class="cal-cell empty"></div>';
  const day = r.date.slice(8);
  const isPending = r.status === 'pending';
  const isHit  = r.eligible && r.hit === true;
  const isMiss = r.eligible && r.hit === false;

  let cls = 'block cal-cell';
  if (isPending) cls += ' pending';
  else if (isHit) cls += ' hit';

  const bg  = (!isPending && r.pct !== null) ? blockBg(r.pct) : '';
  const brd = (!isPending && r.pct !== null) ? blockBorder(r.pct) : '';
  const style = bg ? `style="background:${bg};border:1px solid ${brd};"` : '';

  const pctStr = r.pct !== null ? `${r.pct > 0 ? '+' : ''}${r.pct.toFixed(2)}%` : (isPending ? '…' : '—');
  const missX = isMiss ? '<span class="b-miss-x">✗</span>' : '';
  const eligStr = r.eligible ? '✓ 計入命中率' : '✗ 不計入命中率';
  const actualStr = r.actual || (isPending ? '待結算' : '—');

  const tip = `
    <div class="tip">
      <div><span class="tl">日期 </span><strong>${r.date}</strong></div>
      <div><span class="tl">預測 </span>${r.pick || '—'} &nbsp;→&nbsp; 實際 ${actualStr}</div>
      <div><span class="tl">漲跌 </span>${pctStr}</div>
      <div style="margin-top:4px;font-size:.66rem;color:${r.eligible ? '#3fb950' : '#8b949e'}">${eligStr}</div>
    </div>`;

  return `
  <div class="${cls}" ${style} title="">
    <span class="b-date">${day}</span>
    <span class="b-pct">${pctStr}</span>
    ${missX}
    ${tip}
  </div>`;
}

function metalCalendarHTML(rows, cmcId, alt, title) {
  const logoHTML = `<img src="https://s2.coinmarketcap.com/static/img/coins/64x64/${cmcId}.png" alt="${alt}" style="width:26px;height:26px;vertical-align:middle" onerror="this.style.display='none'">`;
  const { hits, total, rate } = metalStats(rows);
  const rateStr = rate !== null ? (rate * 100).toFixed(0) + '%' : '—';
  const rateCls = rate === null ? '' : rate >= .5 ? 'g' : 'r';

  if (rows.length === 0) {
    return `
    <section class="cal-section">
      <div class="section-head">
        <span style="font-size:26px;line-height:1;margin-right:2px">${logoHTML}</span>
        <h2>${title}</h2>
      </div>
      <p style="text-align:center;color:#6e7681;font-size:.8rem;padding:24px 0">尚無已結算資料</p>
    </section>`;
  }

  const byMonth = {};
  for (const r of rows) {
    const month = r.date.slice(0, 7);
    (byMonth[month] = byMonth[month] || []).push(r);
  }

  const dow = ['日','一','二','三','四','五','六'];
  const months = Object.keys(byMonth).sort().map(month => {
    const monthRows = byMonth[month];
    const byDate = Object.fromEntries(monthRows.map(r => [r.date, r]));
    const [y, m] = month.split('-').map(Number);
    const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();

    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(calCellHTML(null));
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${month}-${String(d).padStart(2, '0')}`;
      cells.push(calCellHTML(byDate[dateStr] || null));
    }

    return `
    <div style="margin-bottom:20px">
      <div style="font-size:.8rem;color:#8b949e;margin-bottom:8px;text-align:center">${month} <span style="color:#6e7681">（↑${monthRows.filter(r=>r.actual==='UP').length}／↓${monthRows.filter(r=>r.actual==='DOWN').length}）</span></div>
      <div class="cal-grid">
        ${dow.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells.join('')}
      </div>
    </div>`;
  }).join('');

  return `
  <section class="cal-section">
    <div class="section-head">
      <span style="font-size:26px;line-height:1;margin-right:2px">${logoHTML}</span>
      <h2>${title}</h2>
      <div class="rate">命中率 <strong class="${rateCls}">${rateStr}</strong>
        <span style="color:#6e7681;font-size:.72rem;margin-left:4px">(${hits}/${total})</span>
      </div>
    </div>
    ${months}
  </section>`;
}

/* ── Render ───────────────────────────────────────────────────────── */
document.getElementById('app').innerHTML = `
  <header class="header">
    <div class="coin-row">
      <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/1.png"    alt="BTC" onerror="this.style.display='none'">
      <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/1027.png" alt="ETH" onerror="this.style.display='none'">
      <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/5176.png" alt="XAUUSD" onerror="this.style.display='none'">
      <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/39343.png" alt="XAGUSD" onerror="this.style.display='none'">
    </div>
    <h1>預測市場命中熱力圖</h1>
  </header>
  ${pillsHTML()}
  ${legendHTML()}
  <div class="layout">
    <div class="col-left">
      ${sectionHTML('BTC')}
      ${sectionHTML('ETH')}
    </div>
    <div class="col-right">
      ${metalCalendarHTML(GOLD_ROWS, 5176, 'XAUUSD', '黃金（Polymarket XAUUSD）')}
      ${metalCalendarHTML(SILVER_ROWS, 39343, 'XAGUSD', '白銀（Polymarket XAGUSD）')}
    </div>
  </div>
`;

</script>
